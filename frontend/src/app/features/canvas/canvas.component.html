<div class="relative h-full w-full select-none overflow-hidden bg-base-200">
  <svg
    #svgRef
    viewBox="0 0 900 700"
    preserveAspectRatio="xMidYMid meet"
    class="block h-full w-full"
    [class]="cursorClass()"
    [style.touch-action]="'none'"
    role="application"
    aria-label="Floor plan editor"
    (pointerdown)="onSvgPointerDown($event)"
    (contextmenu)="onContextMenu($event)"
    (dblclick)="onSvgDoubleClick()"
  >
    <defs>
      <pattern id="gridFine" width="12" height="12" patternUnits="userSpaceOnUse">
        <path d="M12 0H0V12" fill="none" class="grid-line" stroke-width="1" />
      </pattern>
      <pattern id="gridMeter" width="60" height="60" patternUnits="userSpaceOnUse">
        <rect width="60" height="60" fill="url(#gridFine)" />
        <path d="M60 0H0V60" fill="none" class="grid-line-strong" stroke-width="1" />
      </pattern>
    </defs>

    <g [attr.transform]="worldTransform()">
      @if (store.bgImage(); as bg) {
        <image [attr.href]="bg" x="0" y="0" [attr.width]="4 * PX" [attr.opacity]="store.bgOpacity()"></image>
      }
      <rect x="-3000" y="-3000" width="6000" height="6000" fill="url(#gridMeter)"></rect>

      <!-- rooms -->
      <g>
        @for (room of store.rooms(); track room.id) {
          @if (roomHasFill(room) && roomState(room) !== 'hide') {
            <polygon [attr.points]="roomPolygonPoints(room)" class="room-fill" [class.dimmed]="roomState(room) === 'dim'"></polygon>
            <text
              [attr.x]="roomLabelPos(room).x"
              [attr.y]="roomLabelPos(room).y"
              text-anchor="middle"
              class="room-label"
              [class.dimmed]="roomState(room) === 'dim'"
            >{{ roomAreaLabel(room) }}</text>
          }
        }
      </g>

      <!-- walls -->
      <g>
        @for (w of store.walls(); track w.id) {
          @if (sheetState('wall', w.id) !== 'hide') {
          <line
            [attr.x1]="w.x1 * PX" [attr.y1]="w.y1 * PX"
            [attr.x2]="w.x2 * PX" [attr.y2]="w.y2 * PX"
            class="wall-line"
            [class.selected]="isSelected('wall', w.id)"
            [class.dimmed]="sheetState('wall', w.id) === 'dim'"
            [attr.stroke-width]="wallStrokeWidth(w)"
          ></line>
          @if (sheetState('wall', w.id) === 'edit') {
          <line
            [attr.x1]="w.x1 * PX" [attr.y1]="w.y1 * PX"
            [attr.x2]="w.x2 * PX" [attr.y2]="w.y2 * PX"
            class="hit-line"
            data-el-kind="wall" [attr.data-el-id]="w.id"
            [attr.stroke-width]="Math.max(hitWidth(), wallStrokeWidth(w))"
          ></line>
          }
          }
        }
      </g>

      <!-- wiring -->
      <g>
        @for (wire of store.wires(); track wire.id) {
          @if (sheetState('wire', wire.id) !== 'hide' && !isStubWire(wire.id)) {
          <path
            [attr.d]="wireD(wire)"
            class="wire-path"
            [class.energized]="store.simulate()"
            [class.selected]="isSelected('wire', wire.id)"
            [class.dimmed]="sheetState('wire', wire.id) === 'dim'"
            [attr.stroke]="wireColor(wire.circuit)"
          ></path>
          @if (sheetState('wire', wire.id) === 'edit') {
          <path
            [attr.d]="wireD(wire)"
            class="hit-line"
            data-el-kind="wire" [attr.data-el-id]="wire.id"
            [attr.stroke-width]="hitWidth()"
          ></path>
          }
          }
        }
        @for (stub of stubs(); track stub.wireId) {
          @if (stubGeometry(stub); as g) {
            <line [attr.x1]="g.x1" [attr.y1]="g.y1" [attr.x2]="g.x2" [attr.y2]="g.y2" class="wire-stub"></line>
            <text [attr.x]="g.lx" [attr.y]="g.ly" class="stub-label">{{ g.label }}</text>
          }
        }
      </g>

      <!-- components -->
      <g>
        @for (c of store.components(); track c.id) {
          @if (sheetState('component', c.id) !== 'hide') {
          <g
            class="comp-group"
            [class.selected]="isSelected('component', c.id)"
            [class.dimmed]="sheetState('component', c.id) === 'dim'"
            [attr.data-el-kind]="sheetState('component', c.id) === 'edit' ? 'component' : null"
            [attr.data-el-id]="sheetState('component', c.id) === 'edit' ? c.id : null"
            [attr.transform]="compTransform(c)"
          >
            <rect class="comp-hit" x="-17" y="-17" width="34" height="34"></rect>
            <circle
              class="comp-outline"
              r="16"
              [attr.fill]="compColor(c) + '22'"
              [attr.stroke]="compColor(c)"
              stroke-width="1.4"
            ></circle>
            <g transform="translate(-13,-13)" [style.color]="compColor(c)">
              <svg width="26" height="26" viewBox="0 0 24 24" [innerHTML]="compIconHtml(c)"></svg>
            </g>
            <text class="comp-label" x="0" y="29" text-anchor="middle" [attr.transform]="'rotate(' + -(c.rot || 0) + ')'">
              {{ c.label }}
            </text>
          </g>
          }
        }
      </g>

      <!-- draft overlays -->
      <g class="overlay">
        @for (seg of wallDraftLines(); track $index) {
          <line
            [attr.x1]="seg.p1.x * PX" [attr.y1]="seg.p1.y * PX"
            [attr.x2]="seg.p2.x * PX" [attr.y2]="seg.p2.y * PX"
            class="wall-line preview" [attr.stroke-width]="strokeWidthForMm(editor.wallThicknessMm())"
          ></line>
        }
        @if (roomTool.draft(); as r) {
          <rect
            [attr.x]="Math.min(r.x1, r.x2) * PX" [attr.y]="Math.min(r.y1, r.y2) * PX"
            [attr.width]="Math.abs(r.x2 - r.x1) * PX" [attr.height]="Math.abs(r.y2 - r.y1) * PX"
            class="draft-stroke"
          ></rect>
        }
        @if (wireTool.draftLine(); as wd) {
          <path
            [attr.d]="'M ' + wd.from.x * PX + ' ' + wd.from.y * PX + ' L ' + wd.to.x * PX + ' ' + wd.to.y * PX"
            class="draft-stroke"
          ></path>
        }
        @if (editor.tool() === 'component' && componentTool.ghost(); as g) {
          <circle [attr.cx]="g.x * PX" [attr.cy]="g.y * PX" r="16" class="draft-stroke"></circle>
        }
        @if (marquee(); as m) {
          <rect
            [attr.x]="Math.min(m.x1, m.x2) * PX" [attr.y]="Math.min(m.y1, m.y2) * PX"
            [attr.width]="Math.abs(m.x2 - m.x1) * PX" [attr.height]="Math.abs(m.y2 - m.y1) * PX"
            class="marquee"
          ></rect>
        }
      </g>
    </g>
  </svg>

  <!-- floating tool dock (desktop/tablet; phones use the bottom navigation) -->
  <div class="absolute left-2 top-2 z-10 hidden items-center gap-0.5 rounded-box border border-base-content/10 bg-base-100/90 p-1 shadow-lg backdrop-blur md:flex">
      <cp-tool-button label="Select / Move" description="Click to select, Shift+click to add. Drag a component to move it, drag empty space to box-select." shortcut="V" side="bottom" [toggle]="true" [active]="editor.tool() === 'select'" (pressed)="setTool('select')" >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m4 4 7.07 17 2.51-7.39L21 11.07z"/></svg>
      </cp-tool-button>
      <cp-tool-button label="Draw walls" description="Click to add points, double-click or Enter to finish. Right-click deletes a wall; Ctrl+drag selects walls." shortcut="W" side="bottom" [toggle]="true" [active]="editor.tool() === 'wall'" (pressed)="setTool('wall')" >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20 20 4"/><path d="M4 4v4M4 4h4M20 20v-4M20 20h-4"/></svg>
      </cp-tool-button>
      <cp-tool-button label="Quick room" description="Drag a rectangle to create four walls and a room in one step." shortcut="R" side="bottom" [toggle]="true" [active]="editor.tool() === 'room'" (pressed)="setTool('room')" >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1"/></svg>
      </cp-tool-button>
      <cp-tool-button label="Place components" description="Click the plan to place the chosen component; it snaps to walls. Right-click deletes. Esc stops placing." shortcut="P" side="bottom" [toggle]="true" [active]="editor.tool() === 'component'" (pressed)="openComponentTool()" >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><circle cx="12" cy="9" r="1.6"/><path d="M9.5 15h5"/></svg>
      </cp-tool-button>
      <cp-tool-button label="Wire components" description="Click one component, then another, to connect them. Right-click deletes a wire." shortcut="C" side="bottom" [toggle]="true" [active]="editor.tool() === 'wire'" (pressed)="setTool('wire')" >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8 8c3 0 5 8 8 8"/></svg>
      </cp-tool-button>
  </div>

  <!-- room sheet banner -->
  @if (sheetRoom(); as room) {
    <div class="absolute left-2 top-12 z-10 flex max-w-[calc(100%-1rem)] items-center gap-2 rounded-box border border-secondary/40 bg-base-100/95 px-2.5 py-1 text-xs shadow-lg backdrop-blur md:left-64 md:top-2" role="status">
      <span class="truncate font-semibold">Room sheet: {{ room.label }}</span>
      <label class="flex cursor-pointer items-center gap-1 whitespace-nowrap text-base-content/80">
        <input type="checkbox" class="toggle toggle-xs" [checked]="editor.showContext()" (change)="toggleContext()" />
        Surroundings
      </label>
      <button type="button" class="btn btn-xs btn-primary" (click)="backToMaster()">Master plan</button>
    </div>
  }

  <!-- touch interaction mode: what a tap does (mouse users have right-click and Ctrl+drag instead) -->
  <div
    class="absolute left-2 top-2 z-10 flex md:hidden pointer-coarse:flex items-center gap-0.5 rounded-box border border-base-content/10 bg-base-100/90 p-1 shadow-lg backdrop-blur md:left-auto md:right-2"
    role="group" aria-label="Touch mode"
  >
    @for (m of modes; track m.id) {
      <button
        type="button"
        class="btn btn-sm"
        [class.btn-primary]="editor.mode() === m.id"
        [class.btn-ghost]="editor.mode() !== m.id"
        [attr.aria-pressed]="editor.mode() === m.id"
        [attr.title]="m.description"
        (click)="setMode(m.id)"
      >{{ m.label }}</button>
    }
  </div>

  <!-- contextual tool options -->
  <div class="pointer-events-none absolute inset-x-2 bottom-12 z-10 md:inset-x-auto md:right-2 md:top-14 md:bottom-auto">
    <div class="pointer-events-auto">
      <cp-tool-panel />
    </div>
  </div>

  <!-- status hint -->
  <div class="pointer-events-none absolute bottom-2 left-2 right-16 z-10 hidden sm:block">
    <p class="inline-block max-w-full rounded-box border border-base-content/10 bg-base-100/90 px-2.5 py-1 text-[11px] leading-snug text-base-content/80 shadow backdrop-blur" role="status">
      {{ hint() }}<span class="ml-2 text-base-content/60">· Pan: middle-drag or Space+drag · Zoom: wheel</span>
    </p>
  </div>

  <!-- zoom controls -->
  <div class="absolute bottom-2 right-2 z-10 flex flex-col items-center gap-0.5 rounded-box border border-base-content/10 bg-base-100/90 p-1 shadow-lg backdrop-blur">
      <cp-tool-button label="Zoom in" description="Magnify the plan. The mouse wheel works too." shortcut="" side="left" [active]="false" (pressed)="zoomIn()" >
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
      </cp-tool-button>
    <div class="py-0.5 text-center font-mono text-[9.5px] text-base-content/70" aria-live="polite">{{ (editor.zoom() * 100) | number: '1.0-0' }}%</div>
      <cp-tool-button label="Zoom out" description="Shrink the plan to see more." shortcut="" side="left" [active]="false" (pressed)="zoomOut()" >
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
      </cp-tool-button>
      <cp-tool-button label="Fit to view" description="Centre and scale the plan so every wall is visible." shortcut="" side="left" [active]="false" (pressed)="fitToView()" >
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
      </cp-tool-button>
  </div>
</div>
